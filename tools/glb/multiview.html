  for (let i = 0; i < n; i += 3) { const ax = P[i * 3 + 3] - P[i * 3], ay = P[i * 3 + 4] - P[i * 3 + 1], az = P[i * 3 + 5] - P[i * 3 + 2], bx = P[i * 3 + 6] - P[i * 3], by = P[i * 3 + 7] - P[i * 3 + 1], bz = P[i * 3 + 8] - P[i * 3 + 2];

  const P = new Float32Array(pos.length); for (let i = 0; i < pos.length; i++) P[i] = pos[i] / D.q;
  let g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(P, 3)); g.setIndex(new T.BufferAttribute(idx, 1)); g = g.toNonIndexed(); soften(g, 40);
  tris += idx.length / 3;

    g.setAttribute('uv', new T.BufferAttribute(UV2, 2));
    const pc = new T.Color(Q.get('paint') || col), C = new Float32Array(nn * 3); for (let i = 0; i < nn; i++) { C[i * 3] = pc.r; C[i * 3 + 1] = pc.g; C[i * 3 + 2] = pc.b; }

    mat = GLBRT.material(T, tx, D, xf, window.C1K_SH || {});

const W = innerWidth, H = innerHeight, ren = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
ren.setSize(W, H); ren.setScissorTest(true); ren.outputEncoding = T.sRGBEncoding; ren.toneMapping = T.ACESFilmicToneMapping; ren.toneMappingExposure = 1.1;
document.body.appendChild(ren.domElement);
const scene = new T.Scene(); scene.add(model); model.position.y = -0.55;
const pm = new T.PMREMGenerator(ren), es = new T.Scene();
es.add(new T.Mesh(new T.SphereGeometry(10, 16, 8), new T.MeshBasicMaterial({ color: '#8a96b0', side: T.BackSide })));
const lamp = new T.Mesh(new T.PlaneGeometry(8, 3), new T.MeshBasicMaterial({ color: '#fff', side: T.DoubleSide })); lamp.position.set(0, 6, 2); lamp.rotation.x = Math.PI / 2; es.add(lamp);

const views = (Q.get('v') || 'R,FR,F,L,RR,FL').split(','), cols = +(Q.get('cols') || 3), rows = Math.ceil(views.length / cols), vw = W / cols, vh = H / rows;

views.forEach((k, i) => {
  const cam = new T.PerspectiveCamera(22 / zoom, vw / vh, 0.01, 50), d = new T.Vector3(...VIEWS[k]).normalize();
