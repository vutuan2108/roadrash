<script>
// Minimal GLB reader: POSITION (+ indices) of every primitive, with node transforms.
function parseGLB(ab) {
  const dv = new DataView(ab);
  let off = 12, json, bin;
  while (off < ab.byteLength) {
    const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true);
    if (type === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(new Uint8Array(ab, off + 8, len)));
    else bin = ab.slice(off + 8, off + 8 + len);
    off += 8 + len;
  }
  const CT = { 5120: Int8Array, 5121: Uint8Array, 5122: Int16Array, 5123: Uint16Array, 5125: Uint32Array, 5126: Float32Array };
  const NC = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 };
  const acc = i => {
    const a = json.accessors[i], bv = json.bufferViews[a.bufferView];
    return new CT[a.componentType](bin, (bv.byteOffset || 0) + (a.byteOffset || 0), a.count * NC[a.type]);
  };
  const root = new THREE.Group();
  const mk = i => {
    const n = json.nodes[i], o = new THREE.Group();
    if (n.matrix) o.applyMatrix4(new THREE.Matrix4().fromArray(n.matrix));
    if (n.translation) o.position.fromArray(n.translation);
    if (n.rotation) o.quaternion.fromArray(n.rotation);
    if (n.scale) o.scale.fromArray(n.scale);
    if (n.mesh !== undefined) json.meshes[n.mesh].primitives.forEach(p => {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(acc(p.attributes.POSITION)), 3));
      if (p.indices !== undefined) g.setIndex(new THREE.BufferAttribute(new Uint32Array(acc(p.indices)), 1));
      g.computeVertexNormals();
      o.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.55, metalness: 0.05, flatShading: FLAT })));
    });
    (n.children || []).forEach(c => o.add(mk(c)));
    return o;
  };
  json.scenes[json.scene || 0].nodes.forEach(i => root.add(mk(i)));
  return root;
}
const Q = new URLSearchParams(location.search), FLAT = Q.get('flat') === '1';
const bytes = Uint8Array.from(atob(GLB_B64), c => c.charCodeAt(0));
const model = parseGLB(bytes.buffer);
const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
model.position.sub(ctr);
const W = innerWidth, H = innerHeight;
const ren = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
ren.setSize(W, H); ren.setScissorTest(true); ren.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(ren.domElement);
const scene = new THREE.Scene();
scene.add(model);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404850, +(Q.get('amb')||0.75)));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(2, 3, 2.5); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-2, 1, -2); scene.add(fill);
const R = Math.max(size.x, size.y, size.z) * 1.15;
// views: [label, dir] - model axes: x longest, y up, z width (from bounds)
const views = (Q.get('v') || 'side,front,q34,rear,top,q34b').split(',').map(k => ({
  side: [0, 0, 1], side2: [0, 0, -1], front: [1, 0, 0], rear: [-1, 0, 0], q34: [1, 0.35, 1], q34b: [-1, 0.35, 1], top: [0.001, 1, 0], q34c: [1, 0.35, -1],
  fz: [0, 0, 1], fx: [1, 0, 0], fnx: [-1, 0, 0],
}[k] ? { k, d: { side: [0, 0, 1], side2: [0, 0, -1], front: [1, 0, 0], rear: [-1, 0, 0], q34: [1, 0.35, 1], q34b: [-1, 0.35, 1], top: [0.001, 1, 0], q34c: [1, 0.35, -1] }[k] } : null)).filter(Boolean);
const cols = +(Q.get('cols')||3), rows = Math.ceil(views.length / cols), vw = W / cols, vh = H / rows;
views.forEach((v, i) => {
  const cam = new THREE.PerspectiveCamera(22, vw / vh, 0.01, 50);
  const d = new THREE.Vector3(...v.d).normalize();
  cam.position.copy(d.multiplyScalar(R * 2.6));
  cam.up.set(0, 1, 0); if (v.k === 'top') cam.up.set(1, 0, 0);
  cam.lookAt(0, 0, 0);
  const x = (i % cols) * vw, y = H - (Math.floor(i / cols) + 1) * vh;
  ren.setViewport(x, y, vw, vh); ren.setScissor(x, y, vw, vh);
  ren.setClearColor(i % 2 ? 0x2a2f38 : 0x262a32); ren.clear();
  ren.render(scene, cam);
});
document.getElementById('info').textContent = `size ${size.x.toFixed(3)} x ${size.y.toFixed(3)} x ${size.z.toFixed(3)} | views ${views.map(v => v.k).join(' ')}`;
</script></body></html>
