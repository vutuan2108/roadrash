<script>
// Photo analysis: background flood fill -> bike mask, tyre circles, colour classes.
window.RESULT = null;
const img = new Image();

          if (dark) best = t; }

    else if (v < 0.2) k = 5;
    else if (s < 0.25 && v > 0.55) k = 7;

  const PAL = [[40, 44, 52], [205, 24, 34], [30, 62, 170], [70, 150, 235], [244, 244, 244], [18, 18, 22], [70, 72, 78], [185, 190, 196], [200, 160, 60], [120, 10, 16]];
  const sc = Q => Q, out = document.getElementById('c'), ow = 1950, oh = Math.round(H * ow / W); out.width = ow; out.height = oh * 3;
  const og = out.getContext('2d'); og.drawImage(img, 0, 0, ow, oh);
  const id = og.createImageData(ow, oh);
  for (let y = 0; y < oh; y++) for (let x = 0; x < ow; x++) { const k = cls[Math.floor(y * H / oh) * W + Math.floor(x * W / ow)], p = PAL[k], j = (y * ow + x) * 4;
    id.data[j] = p[0]; id.data[j + 1] = p[1]; id.data[j + 2] = p[2]; id.data[j + 3] = 255; }
  og.putImageData(id, 0, oh);
  const f = ow / W; og.strokeStyle = '#0f0'; og.lineWidth = 2;
  for (const c of [RW, FW]) for (const oy of [0, oh]) { og.beginPath(); og.arc(c.cx * f, c.cy * f + oy, c.r * f, 0, Math.PI * 2); og.stroke(); }
  og.strokeStyle = '#ff0'; og.strokeRect(x0 * f, y0 * f, (x1 - x0) * f, (y1 - y0) * f);

  const cm = ([z, y]) => [z, -y], d1 = [cm(mA[1])[0] - cm(mA[0])[0], cm(mA[1])[1] - cm(mA[0])[1]], d2 = [pA[1][0] - pA[0][0], pA[1][1] - pA[0][1]];

  const m0 = cm(mA[0]), cr = pA[0][0] - (kr * m0[0] - ki * m0[1]), ci = pA[0][1] - (kr * m0[1] + ki * m0[0]);
  const toP = (z, y) => { const a = z, b = -y; return [kr * a - ki * b + cr, kr * b + ki * a + ci]; };
  og.drawImage(img, 0, oh * 2, ow, oh);
  og.fillStyle = 'rgba(0,255,90,0.28)'; og.beginPath();
  for (let t = 0; t < MP.I.length; t += 3) {
    const q = [0, 1, 2].map(e => { const i = MP.I[t + e]; return toP(MP.P[i * 3 + 2], MP.P[i * 3 + 1]); });
    if ((q[1][0] - q[0][0]) * (q[2][1] - q[0][1]) - (q[1][1] - q[0][1]) * (q[2][0] - q[0][0]) < 0) [q[1], q[2]] = [q[2], q[1]];   // same winding for all, so the fill does not cancel
    og.moveTo(q[0][0] * f, q[0][1] * f + 2 * oh); og.lineTo(q[1][0] * f, q[1][1] * f + 2 * oh); og.lineTo(q[2][0] * f, q[2][1] * f + 2 * oh); og.closePath();
  }
  og.fill('nonzero');
  // ---- livery texture: crop + downsample (2x2 majority), drop spoke gaps, smooth, fill the background from the nearest bike pixel
  const CX = 300, CY = 40, SC = 0.6522, TW = 2048, TH = 1280, tc = new Uint8Array(TW * TH);
  const meanC = Array.from({ length: 10 }, () => [0, 0, 0, 0]);
  for (let i = 0; i < W * H; i++) { const k = cls[i]; if (!k) continue; const m = meanC[k]; m[0] += D[i * 4]; m[1] += D[i * 4 + 1]; m[2] += D[i * 4 + 2]; m[3]++; }
  const inWheel = (x, y) => [RW, FW].some(c => Math.hypot(x - c.cx, y - c.cy) < c.r * 0.93);
  for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
    const sx = CX + x / SC, sy = CY + y / SC, cnt = new Uint8Array(10);
    for (const [dx, dy] of [[0, 0], [0.75, 0], [0, 0.75], [0.75, 0.75]]) { const px = Math.min(W - 1, Math.round(sx + dx)), py = Math.min(H - 1, Math.round(sy + dy)); cnt[cls[py * W + px]]++; }
    let k = 0; for (let j = 1; j < 10; j++) if (cnt[j] > cnt[k]) k = j;
    if (k === 4 && inWheel(sx, sy)) k = 0;
    tc[y * TW + x] = k;
  }
  // majority filter (3x3, twice) on bike pixels: removes speckle from highlights and texture
  for (let pass = 0; pass < 2; pass++) {
    const src = tc.slice();

  while (q.length) { const nq = []; for (const i of q) { const x = i % TW, y = (i / TW) | 0;
      for (const j of [x > 0 ? i - 1 : -1, x < TW - 1 ? i + 1 : -1, y > 0 ? i - TW : -1, y < TH - 1 ? i + TW : -1]) if (j >= 0 && !tc[j]) { tc[j] = tc[i]; nq.push(j); } }
    q = nq; }

    for (let i = 0; i < TW * TH; i++) { const p = PAL[tc[i]]; im.data[i * 4] = p[0]; im.data[i * 4 + 1] = p[1]; im.data[i * 4 + 2] = p[2]; im.data[i * 4 + 3] = 255; }
    g2.putImageData(im, 0, 0); return c.toDataURL('image/png'); })();
  window.RESULT = { W, H, bounds: [x0, y0, x1, y1], RW, FW, k: [kr, ki], c: [cr, ci], pxPerM: Math.hypot(kr, ki), crop: { CX, CY, SC, TW, TH }, rleBytes: bytes.length,

function meshPts() {

}
img.src = PHOTO;
