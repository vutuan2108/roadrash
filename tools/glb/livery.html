<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
{ const m = new URLSearchParams(location.search).get('m') || 'cbr';
  document.write(`<script src="file:///F:/hb_tmp/${m}/${m}.js"><\/script><script src="liv_${m}.js"><\/script>`); }
</script>
<script>
// Painted livery for a packed body without a photo. Texture space = side view: px = 1000*z + 1024, py = 1260 - 1000*y
// (2048 x 1280, 1 mm per texel). ?ref=1 draws the silhouette with a 0.1 m grid to design on; otherwise the livery
// classes are painted, previewed inside the silhouette and returned (RLE + left-side text boxes).
const Q = new URLSearchParams(location.search), D = HB_GLB[Q.get('m') || 'cbr'];
const TW = 2048, TH = 1280, PX = z => 1000 * z + 1024, PY = y => 1260 - 1000 * y;
const PAL = ['#151517', '#c8121f', '#1c3d9e', '#2f93e0', '#eeeeee', '#151517', '#3a3b3e', '#b8bcc2', '#c9a22a', '#151517'];
const dec = (G) => [new Int16Array(Uint8Array.from(atob(G.pos), c => c.charCodeAt(0)).buffer),
  G.n32 ? new Uint32Array(Uint8Array.from(atob(G.idx), c => c.charCodeAt(0)).buffer) : new Uint16Array(Uint8Array.from(atob(G.idx), c => c.charCodeAt(0)).buffer)];
// multi-part bodies: the livery only covers the 'paint' group; the other groups are drawn grey in the reference
const ALL = D.groups ? D.groups.map(G => [...dec(G), G.cat === 'paint']) : [[...dec(D), true]];
const [pos, idx] = ALL.find(a => a[2]);
const sil = document.createElement('canvas'); sil.width = TW; sil.height = TH;
{ const g = sil.getContext('2d'); g.fillStyle = '#fff'; g.beginPath();
  for (let t = 0; t < idx.length; t += 3) {
    const q = [0, 1, 2].map(e => { const i = idx[t + e]; return [PX(pos[i * 3 + 2] / D.q), PY(pos[i * 3 + 1] / D.q)]; });
    if ((q[1][0] - q[0][0]) * (q[2][1] - q[0][1]) - (q[1][1] - q[0][1]) * (q[2][0] - q[0][0]) < 0) [q[1], q[2]] = [q[2], q[1]];
    g.moveTo(...q[0]); g.lineTo(...q[1]); g.lineTo(...q[2]); g.closePath();
  }
  g.fill(); }
const out = document.getElementById('c'); out.width = TW; out.height = TH; const o = out.getContext('2d');
const grid = () => {
  o.lineWidth = 1;
  for (let z = -1.0; z <= 1.0001; z += 0.05) { o.strokeStyle = Math.abs(z * 10 - Math.round(z * 10)) < 1e-6 ? 'rgba(0,255,120,0.55)' : 'rgba(0,255,120,0.18)'; o.beginPath(); o.moveTo(PX(z), 0); o.lineTo(PX(z), TH); o.stroke(); }
  for (let y = 0; y <= 1.26; y += 0.05) { o.strokeStyle = Math.abs(y * 10 - Math.round(y * 10)) < 1e-6 ? 'rgba(0,255,120,0.55)' : 'rgba(0,255,120,0.18)'; o.beginPath(); o.moveTo(0, PY(y)); o.lineTo(TW, PY(y)); o.stroke(); }
  o.fillStyle = '#ff0'; o.font = '22px monospace';
  for (let z = -1.0; z <= 1.0001; z += 0.1) o.fillText(z.toFixed(1), PX(z) + 3, 24);
  for (let y = 0.1; y <= 1.26; y += 0.1) o.fillText(y.toFixed(1), 4, PY(y) - 4);
};
if (Q.get('ref') === '2') {   // shaded side view from the right (painter's order: far side first)
  o.fillStyle = '#20242c'; o.fillRect(0, 0, TW, TH);
  const T = [];
  for (const [pos, idx, isPaint] of ALL) for (let t = 0; t < idx.length; t += 3) {
    const v = [0, 1, 2].map(e => { const i = idx[t + e]; return [pos[i * 3] / D.q, pos[i * 3 + 1] / D.q, pos[i * 3 + 2] / D.q]; });
    const a = v[1].map((x, k) => x - v[0][k]), b = v[2].map((x, k) => x - v[0][k]);
    let n = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; const l = Math.hypot(...n) || 1; n = n.map(x => x / l);
    if (n[0] > 0) n = n.map(x => -x);   // face the camera (at -x)
    const L = [-0.55, 0.6, 0.58], s = 0.25 + 0.75 * Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2]);
    T.push({ x: (v[0][0] + v[1][0] + v[2][0]) / 3, v, s, p: isPaint });
  }
  T.sort((p, q) => q.x - p.x);
  for (const tr of T) { const c = Math.round(tr.s * 235); o.fillStyle = tr.p ? `rgb(${c},${Math.round(c * 0.75)},${Math.round(c * 0.7)})` : `rgb(${Math.round(c * 0.45)},${Math.round(c * 0.5)},${Math.round(c * 0.6)})`; o.strokeStyle = o.fillStyle; o.beginPath();
    o.moveTo(PX(tr.v[0][2]), PY(tr.v[0][1])); o.lineTo(PX(tr.v[1][2]), PY(tr.v[1][1])); o.lineTo(PX(tr.v[2][2]), PY(tr.v[2][1])); o.closePath(); o.fill(); o.stroke(); }
  grid(); window.RESULT = 1;
} else if (Q.get('ref')) {
  o.fillStyle = '#20242c'; o.fillRect(0, 0, TW, TH); o.drawImage(sil, 0, 0); grid();
  window.RESULT = 1;
} else {
  // paint the classes on a canvas in exact palette colours, then read them back as class indices
  const L = document.createElement('canvas'); L.width = TW; L.height = TH; const g = L.getContext('2d');
  g.imageSmoothingEnabled = false;
  const boxes = [];
  LIVERY(g, { PX, PY, PAL, TW, TH, boxes });
  const im = g.getImageData(0, 0, TW, TH).data, rgb = PAL.map(h => [1, 3, 5].map(k => parseInt(h.substr(k, 2), 16)));
  const cls = new Uint8Array(TW * TH);
  for (let i = 0; i < TW * TH; i++) {
    let best = 1, bd = 1e9; for (let k = 1; k < 9; k++) { const d = (im[i * 4] - rgb[k][0]) ** 2 + (im[i * 4 + 1] - rgb[k][1]) ** 2 + (im[i * 4 + 2] - rgb[k][2]) ** 2; if (d < bd) { bd = d; best = k; } }
    cls[i] = best;
  }
  const bytes = [];
  for (let y = 0; y < TH; y++) { let x = 0; while (x < TW) { const k = cls[y * TW + x]; let n = 1; while (x + n < TW && n < 4095 && cls[y * TW + x + n] === k) n++; const v = (k << 12) | n; bytes.push(v >> 8, v & 255); x += n; } }
  let bin = ''; for (const b of bytes) bin += String.fromCharCode(b);
  // preview: livery inside the silhouette, darkened outside, grid
  o.fillStyle = '#20242c'; o.fillRect(0, 0, TW, TH);
  const pv = o.createImageData(TW, TH), sm = sil.getContext('2d').getImageData(0, 0, TW, TH).data;
  for (let i = 0; i < TW * TH; i++) { const c = rgb[cls[i]], a = sm[i * 4 + 3] > 0 ? 1 : 0.25;
    pv.data[i * 4] = c[0] * a + 32 * (1 - a); pv.data[i * 4 + 1] = c[1] * a + 36 * (1 - a); pv.data[i * 4 + 2] = c[2] * a + 44 * (1 - a); pv.data[i * 4 + 3] = 255; }
  o.putImageData(pv, 0, 0);
  if (Q.get('grid')) grid();
  window.CLSOUT = { k: [1000, 0], c: [1024, 1260], crop: { CX: 0, CY: 0, SC: 1, TW, TH }, rle: btoa(bin),
    boxes: boxes.map(b => [b[0] / TW, b[1] / TH, (b[0] + b[2]) / TW, (b[1] + b[3]) / TH, (b[4] - b[0]) / TW, (b[5] - b[1]) / TH].map(v => +v.toFixed(6))) };
  window.RESULT = { rleBytes: bytes.length, boxes: boxes.length };
}
</script></body></html>
