<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Highway Brawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 1.6));
    height: min(100vh, calc(100vw / 1.6));
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="game" width="512" height="320"></canvas>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/sprites.js"></script>
<script src="js/cars.js"></script>
<script src="js/props.js"></script>
<script src="js/props2.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/track.js"></script>
<script src="js/render.js"></script>
<script src="js/race.js"></script>
<script src="js/main.js"></script>
</body>
</html>
